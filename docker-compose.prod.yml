version: "3.9"

services:
  backend:
    # Built and pushed from your laptop/CI, not on the VM. See build-and-push.sh.
    image: kushalzinzuvadia/candidate-screener-backend:latest
    ports:
      # Bound to localhost only, for `ssh -L 8000:localhost:8000` debugging.
      # Public traffic comes in through Caddy on 443, not directly on 8000.
      - "127.0.0.1:8000:8000"
    volumes:
      # Still mounted: `git pull` on the VM updates app code instantly, no
      # rebuild needed. Only requirements.txt changes require a new image.
      - ./backend:/app
      - chroma_data:/app/chroma_data
      - uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: screener
      POSTGRES_DB: screening
    ports:
      # Don't expose Postgres port to the public internet in prod
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  chroma_data:
  uploads:
  pg_data:
  caddy_data:
  caddy_config: 
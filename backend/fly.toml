# fly.toml app configuration file generated for Candidate Screener

# You can leave 'app' blank or specify a preferred name. 
# Fly will override this during the dashboard creation process.
app = "candidate-screener-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[mounts]
  source = "app_data"
  destination = "/app/data"

[env]
  LLM_PROVIDER = "groq"
  LLM_MODEL = "llama-3.3-70b-versatile"
  EMBEDDING_MODEL = "all-MiniLM-L6-v2"
  MAX_QUESTIONS_PER_INTERVIEW = "6"
  RETRIEVAL_TOP_K = "4"
  # Point storage to the persistent volume we mounted above
  DATABASE_URL = "sqlite:////app/data/screening.db"
  CHROMA_PERSIST_DIR = "/app/data/chroma_data"
